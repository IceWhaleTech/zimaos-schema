name: Generate ZimaApp schema

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve source submodule commit
        id: source
        run: echo "commit=$(git rev-parse HEAD:reops/ZimaOS-AppManagement)" >> "$GITHUB_OUTPUT"

      - name: Resolve Compose submodule commit
        id: compose
        run: echo "commit=$(git rev-parse HEAD:reops/compose-go)" >> "$GITHUB_OUTPUT"

      - name: Require private submodule token
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: test -n "$SUBMODULES_TOKEN"

      - name: Check out source submodule
        uses: actions/checkout@v4
        with:
          repository: IceWhaleTech/ZimaOS-AppManagement
          ref: ${{ steps.source.outputs.commit }}
          path: reops/ZimaOS-AppManagement
          persist-credentials: false
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Verify source submodule
        run: |
          expected_commit="$(git rev-parse HEAD:reops/ZimaOS-AppManagement)"
          actual_commit="$(git -C reops/ZimaOS-AppManagement rev-parse HEAD)"
          test "$actual_commit" = "$expected_commit"

      - name: Check out Compose submodule
        uses: actions/checkout@v4
        with:
          repository: compose-spec/compose-go
          ref: ${{ steps.compose.outputs.commit }}
          path: reops/compose-go
          persist-credentials: false

      - name: Verify Compose submodule
        run: |
          expected_commit="$(git rev-parse HEAD:reops/compose-go)"
          actual_commit="$(git -C reops/compose-go rev-parse HEAD)"
          test "$actual_commit" = "$expected_commit"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: reops/ZimaOS-AppManagement/go.mod
          cache-dependency-path: reops/ZimaOS-AppManagement/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install formatter
        run: npm ci

      - name: Generate and sync ZimaApp schemas
        run: npm run generate:zimaapp

      - name: Check schema formatting
        run: npx --no-install oxfmt --check schema/compose-go/v1.20.2/compose-spec.json schema/zimaapp/v2/*.schema.json

      - name: Check generated artifacts
        run: |
          compose_ref="$(jq -r '.allOf[0]["$ref"]' schema/zimaapp/v2/zimaapp-v2app.schema.json)"
          test -f "schema/zimaapp/v2/$compose_ref"
          git diff --exit-code -- schema/compose-go/v1.20.2 schema/zimaapp/v2
          test -z "$(git status --porcelain --untracked-files=all -- schema/compose-go/v1.20.2 schema/zimaapp/v2)"
